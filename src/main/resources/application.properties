spring.application.name=workpulse

# Docker Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5435/hrms_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=workpulse

# Hibernate Configuration
# Set to 'validate' or 'none' so Spring Boot does not accidentally drop the tables you built in pgAdmin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080

